<!DOCTYPE html>
<html>
<head>
    <!-- 1. VIEWPORT META TAG: Makes the page look good on phones -->
     <meta name="viewport" content="width=device=width, initial-scale=1.0">
<title>My Simple Page</title>
</head>

<!-- 2. BODY TAG: Everything inside here shows up on the screen -->
 <body bgcolor="gold">

    <!--3. HEADINGS (h1 to h6): Big titles get smaller as the number goes up -->
    <h1 align="center">This is a Heading 1 (Biggest)</h1>
    <h2>This is Heading 2</h2>
    <h3>This is Heading 3</h3>

    <!--4. PARAGRAPH: Regular blocks of text-->
    <p>This is a normal paragraph. It is used for writing sentences and long text.</p>

    <!-- 5. UNORDERED LIST: A bullet-point list -->
     <p>My favorite fruits:</p>
     <ul>
    <li>Apples</li>
    <li>Bananas</li>
    <li>Cherries</li>
    </ul>

    <!-- 6. LINK: Clicking this takes you to another website -->
    <p>Visit <a href="https:/www.google.com">Google Here</a> (click the blue text).</p>

    <!-- 7. IMAGE: Shows a picture on your page-->
    <p>Here is a placeholder image:</p>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRApgR2uS0rFIjJ_3aOs2c8yGaX8SiltQc4fsIgWPX9rkfTg_Hi" alt="A placeholder image" width="555">

</body>
</html>
