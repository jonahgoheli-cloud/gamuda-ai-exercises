          function getFullName(member) {
              if(!member || !member.firstName || !member.lastName) {
                return "Invalid member data";
              }
              return `${member.firstName} ${member.lastName}`;
          }

          function countFullNameVowels(member) {
            const fullName = getFullName(member).toLowerCase();
            const vowels = "aeiou";
            let vowelCount = 0;


          for (let i=0; i < fullName.length; i++) {
            if (vowels.includes(fullName[i])) {
                vowelCount++;
            }
          }
          return vowelCount;
        }

        function isFoodLover(member) {
            if (!member || !Array.isArray(member.favoriteFoods)) {
                return false;
            }
            return member.favoriteFoods.length > 1;
        }

        function isPetKeeper(member) {
            if (!member || !Array.isArray(member.pets)) {
                return false;
            }
            return member.pets.length > 1;
